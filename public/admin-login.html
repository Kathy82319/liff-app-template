<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台登入</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">管理後台</h1>
            <p class="text-gray-500 text-sm mt-2">請登入以繼續</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
<div>
    <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
        帳號
    </label>
    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
           id="email" 
           type="text" 
           placeholder="請輸入帳號 (預設: admin)" 
           required>
</div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-gray-700 text-sm font-bold" for="password">密碼</label>
                    <a href="#" onclick="openForgotModal(event)" class="text-xs text-blue-500 hover:text-blue-800">忘記密碼?</a>
                </div>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" 
                       id="password" type="password" placeholder="******************" required>
            </div>
            <div class="flex items-center justify-between">
                <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-300" 
                        type="submit" id="loginBtn">
                    登入系統
                </button>
            </div>
        </form>
    </div>

    <div id="forgotModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-80">
        <h3 class="text-lg font-bold mb-4">重置密碼</h3>
        <p class="text-sm text-gray-600 mb-4">請輸入您的帳號，系統將透過 LINE 發送臨時密碼給您。</p>
        
        <input type="text" id="forgotEmail" class="w-full border p-2 rounded mb-4" placeholder="請輸入帳號">
        
        <div class="flex justify-end space-x-2">
            <button onclick="closeForgotModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">取消</button>
            <button onclick="submitForgotPassword()" id="btnSendForgot" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">發送 LINE</button>
        </div>
    </div>
</div>

    <script>
        // 登入邏輯
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            // 簡單驗證
            if(!email || !password) {
                alert('請輸入帳號密碼');
                return;
            }

            btn.innerText = '登入中...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    window.location.href = '/admin-panel.html';
                } else {
                    alert(data.error || '登入失敗');
                }
            } catch (error) {
                console.error(error);
                alert('系統錯誤，無法連線');
            } finally {
                btn.innerText = '登入系統';
                btn.disabled = false;
            }
        });

        // 忘記密碼邏輯
        function openForgotModal(e) {
            if(e) e.preventDefault();
            document.getElementById('forgotModal').classList.replace('hidden', 'flex');
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.replace('flex', 'hidden');
        }

        async function submitForgotPassword() {
        // 這裡抓取輸入框的值 (假設輸入框 id 還是叫 id，或者您也可以改成 forgotUsername)
        const usernameInput = document.getElementById('id').value;
        
        if (!usernameInput) {
            alert('請輸入帳號');
            return;
        }

        const btn = document.getElementById('btnSendForgot');
        const originalText = btn.innerText;
        btn.innerText = '發送中...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/admin/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // 🟢 修改點：這裡改用 username 作為 key
                body: JSON.stringify({ username: usernameInput })
            });

            const result = await response.json();
            if (response.ok) {
                alert(result.message);
                closeForgotModal();
            } else {
                alert(result.error || '發送失敗');
            }
        } catch (e) {
            alert('系統連線錯誤');
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
