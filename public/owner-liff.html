<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理系統登入</title>
    <style>
        /* ... 原有的 styles ... */
        /* 新增：用於顯示日誌的小區域 */
        #login-log-output {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #555;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 8px;
            border-radius: 4px;
            max-height: 80px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>管理系統登入</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">管理員帳號</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label for="login-password">密碼</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" id="login-button">登入</button>
            <p id="login-status" class="status-message"></p>
            <div id="login-log-output">Login Logs:</div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const logOutput = document.getElementById('login-log-output'); // 取得日誌區域

            // 輔助函式：將訊息顯示在畫面上並輸出到 console
            function logMessage(message) {
                console.log(message); // 輸出到 console
                if (logOutput) {
                    const time = new Date().toLocaleTimeString();
                    logOutput.textContent += `\n[${time}] ${message}`;
                    logOutput.scrollTop = logOutput.scrollHeight; // 自動捲動到底部
                }
            }

            if (!loginForm) return;

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value;
                const loginStatus = document.getElementById('login-status');
                const loginButton = document.getElementById('login-button');

                loginStatus.textContent = '';
                loginButton.disabled = true;
                loginButton.textContent = '登入中...';
                logMessage('登入請求已發送...');

                try {
                    const response = await fetch('/api/admin/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const result = await response.json();

                    logMessage(`登入 API 回應狀態: ${response.status}`);
                    // 注意：無法直接從 JavaScript 讀取 Set-Cookie 回應標頭
                    if (!response.ok) throw new Error(result.error || '登入失敗');

                    logMessage('登入 API 成功。等待瀏覽器處理 Cookie...');

                    // *** 關鍵偵錯點 1：延遲檢查 Cookie ***
                    // 給瀏覽器一點時間處理 Set-Cookie 指令
                    setTimeout(() => {
                        logMessage('檢查 Cookie 是否已設定...');
                        const currentCookies = document.cookie;
                        logMessage(`目前 document.cookie: ${currentCookies || '(空)'}`);

                        if (currentCookies && currentCookies.includes('AuthToken=')) {
                            logMessage('✅ AuthToken Cookie 已找到！準備跳轉...');
                            window.location.href = '/admin-panel.html';
                        } else {
                            logMessage('❌ 錯誤：AuthToken Cookie 未設定！無法跳轉。');
                            loginStatus.textContent = '登入失敗：無法設定驗證 Cookie。';
                            loginButton.disabled = false; // 重新啟用按鈕
                            loginButton.textContent = '登入';
                        }
                    }, 200); // 稍微等待 200 毫秒

                } catch (error) {
                    loginStatus.textContent = error.message;
                    logMessage(`登入失敗: ${error.message}`);
                    loginButton.disabled = false; // 發生錯誤時重新啟用按鈕
                    loginButton.textContent = '登入';
                }
                // 成功登入後不重新啟用按鈕，因為會跳轉
            });
        });
    </script>
</body>
</html>
